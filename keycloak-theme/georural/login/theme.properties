# Tema de login do GeoRural DataHub (T29).
# Herda o tema padrao do Keycloak 26 (keycloak.v2, PatternFly 5) e so acrescenta o visual do sistema.
parent=keycloak.v2

# css/styles.css e o do tema padrao (continua valendo); css/georural.css e o nosso e vem por ultimo.
# Nao crie um arquivo chamado styles.css aqui: ele esconderia o do tema padrao.
styles=css/styles.css css/georural.css

# O sistema usa visual escuro: este script liga o modo escuro do PatternFly sempre.
scripts=js/dark.js js/demo-login.js
# js/demo-login.js: TEMPORÁRIO (apresentação), preenche usuário e senha do gestor. Tirar depois.
