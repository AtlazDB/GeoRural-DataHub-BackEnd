spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.flyway.enabled=true
# As migrations são reservadas por tarefa (V8 Tarefa 4, V9 Tarefa 5, V10 Tarefa 6, V11 Tarefa 2, V12 Tarefa 3)
# e chegam fora de ordem. Sem isto, uma V8 que chega depois da V9 já aplicada impede o back de subir.
spring.flyway.out-of-order=true
spring.docker.compose.enabled=false

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=510MB

oci.namespace=${OCI_NAMESPACE}
oci.bucket=${OCI_BUCKET}
oci.zona-bruta=${OCI_ZONA_BRUTA:bruta}

app.cors.origens=${APP_CORS_ORIGENS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}

# Swagger/OpenAPI dentro de /api/v1, para passar pelo proxy /api/ do nginx sem mexer nele.
# SWAGGER_HABILITADO=false desliga a documentação (a API continua igual).
springdoc.api-docs.path=/api/v1/docs/openapi
springdoc.swagger-ui.path=/api/v1/docs
springdoc.api-docs.enabled=${SWAGGER_HABILITADO:true}
springdoc.swagger-ui.enabled=${SWAGGER_HABILITADO:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# API REST do Airflow: o "Revalidar" da quarentena dispara uma DAG e espera a resposta. Sem
# usuário e senha, chama sem token (o Airflow local roda sem login).
app.airflow.url=${AIRFLOW_URL:http://localhost:8088}
app.airflow.usuario=${AIRFLOW_USUARIO:}
app.airflow.senha=${AIRFLOW_SENHA:}
app.airflow.espera-segundos=${AIRFLOW_ESPERA_SEGUNDOS:60}
